name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      # The mod against a stub game API: it must be valid Lua, and it must write the fields the pad screen reads
      # even when the game refuses the calls this build does not have.
      - run: python3 tests/cet-mod-test.py

      - name: the archive is the mod, and nothing else
        run: |
          ./packaging.sh
          count=$(python3 -c "import zipfile;print(len(zipfile.ZipFile('dist/g13-hud-1.0.zip').infolist()))")
          echo "archive holds $count file(s)"
          [ "$count" = "1" ] || { echo "the archive should hold exactly the Lua" >&2; exit 1; }
          python3 -c "
          import zipfile
          names = zipfile.ZipFile('dist/g13-hud-1.0.zip').namelist()
          assert names == ['bin/x64/plugins/cyber_engine_tweaks/mods/g13-hud/init.lua'], names
          print('one file, at the path CET loads from')"
